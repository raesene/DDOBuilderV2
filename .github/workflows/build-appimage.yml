name: Build AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install v142 Build Tools and MFC Libraries
        run: |
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"

          # Download VS Enterprise bootstrapper
          Write-Host "Downloading VS Enterprise bootstrapper..."
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_enterprise.exe" -OutFile "vs_enterprise.exe"

          $components = @(
            "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64",
            "Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL",
            "Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC",
            "Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64"
          )

          $args = @("modify", "--installPath", $installPath, "--passive", "--norestart")
          foreach ($component in $components) {
            $args += "--add"
            $args += $component
          }

          Write-Host "Running VS installer with components..."
          Write-Host "Arguments: $($args -join ' ')"
          $process = Start-Process -FilePath ".\vs_enterprise.exe" -ArgumentList $args -Wait -PassThru
          Write-Host "Exit code: $($process.ExitCode)"

          # Exit codes: 0=success, 3010=success but reboot needed, 8xxx=partial failure
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            Write-Host "Warning: VS Installer returned exit code $($process.ExitCode)"
          }

          # Verify MFC was installed by checking multiple possible versions
          $msvcPath = "$installPath\VC\Tools\MSVC"
          Write-Host "Checking MSVC installations..."
          Get-ChildItem $msvcPath -ErrorAction SilentlyContinue | ForEach-Object {
            $version = $_.Name
            $mfcPath = Join-Path $_.FullName "atlmfc"
            if (Test-Path $mfcPath) {
              Write-Host "Found MFC at: $mfcPath (version $version)"
            }
          }
        shell: pwsh
        timeout-minutes: 20

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          toolset: 14.29

      - name: Build DDOBuilder
        run: |
          msbuild DDOBuilder.sln /p:Configuration=Release /p:Platform=Win32

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddobuilder-windows
          path: |
            Output/DDOBuilder.exe
            Output/DataFiles/
            Output/Default.ini
            Output/Example Builds/

  package-appimage:
    needs: build-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: ddobuilder-windows
          path: windows-build/

      - name: Install Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine32 winetricks wget icoutils libfuse2

      - name: Build AppImage
        run: |
          chmod +x linux-packaging/scripts/package-appimage.sh
          DDOBUILDER_EXE=windows-build/DDOBuilder.exe \
          DATA_DIR=windows-build/DataFiles \
          DEFAULT_INI=windows-build/Default.ini \
          EXAMPLE_BUILDS_DIR="windows-build/Example Builds" \
          linux-packaging/scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: DDOBuilder-AppImage
          path: DDOBuilder-*.AppImage

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: DDOBuilder-*.AppImage
