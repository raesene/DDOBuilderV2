name: Build AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install v142 Build Tools and MFC Libraries
        run: |
          $vsSetup = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $components = @(
            "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64",
            "Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL",
            "Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC"
          )
          $args = @("modify", "--installPath", $installPath, "--quiet", "--norestart", "--wait")
          foreach ($component in $components) {
            $args += "--add"
            $args += $component
          }
          Write-Host "Running: $vsSetup $($args -join ' ')"
          $process = Start-Process -FilePath $vsSetup -ArgumentList $args -Wait -PassThru
          Write-Host "Exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "VS Installer failed with exit code $($process.ExitCode)"
          }
          # Verify MFC was installed
          $mfcPath = "$installPath\VC\Tools\MSVC\14.29.30133\atlmfc"
          if (Test-Path $mfcPath) {
            Write-Host "MFC installed successfully at: $mfcPath"
            Get-ChildItem $mfcPath
          } else {
            Write-Host "Warning: MFC path not found at expected location"
            Write-Host "Checking available MSVC versions..."
            Get-ChildItem "$installPath\VC\Tools\MSVC\" -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          toolset: 14.29

      - name: Build DDOBuilder
        run: |
          msbuild DDOBuilder.sln /p:Configuration=Release /p:Platform=Win32

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddobuilder-windows
          path: |
            Output/DDOBuilder.exe
            Output/DataFiles/
            Output/Default.ini
            Output/Example Builds/

  package-appimage:
    needs: build-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: ddobuilder-windows
          path: windows-build/

      - name: Install Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine32 winetricks wget icoutils libfuse2

      - name: Build AppImage
        run: |
          chmod +x linux-packaging/scripts/package-appimage.sh
          DDOBUILDER_EXE=windows-build/DDOBuilder.exe \
          DATA_DIR=windows-build/DataFiles \
          DEFAULT_INI=windows-build/Default.ini \
          EXAMPLE_BUILDS_DIR="windows-build/Example Builds" \
          linux-packaging/scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: DDOBuilder-AppImage
          path: DDOBuilder-*.AppImage

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: DDOBuilder-*.AppImage
