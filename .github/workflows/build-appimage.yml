name: Build AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install v142 Build Tools and MFC Libraries
        run: |
          $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $components = @(
            "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64",
            "Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL",
            "Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC"
          )
          $addArgs = ($components | ForEach-Object { "--add $_" }) -join " "
          $cmd = "& `"$vsInstaller`" modify --installPath `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise`" $addArgs --quiet --norestart --wait"
          Write-Host "Running: $cmd"
          Invoke-Expression $cmd
        shell: pwsh

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          toolset: 14.29

      - name: Build DDOBuilder
        run: |
          msbuild DDOBuilder.sln /p:Configuration=Release /p:Platform=Win32

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddobuilder-windows
          path: |
            Output/DDOBuilder.exe
            Output/DataFiles/
            Output/Default.ini
            Output/Example Builds/

  package-appimage:
    needs: build-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: ddobuilder-windows
          path: windows-build/

      - name: Install Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine32 winetricks wget icoutils libfuse2

      - name: Build AppImage
        run: |
          chmod +x linux-packaging/scripts/package-appimage.sh
          DDOBUILDER_EXE=windows-build/DDOBuilder.exe \
          DATA_DIR=windows-build/DataFiles \
          DEFAULT_INI=windows-build/Default.ini \
          EXAMPLE_BUILDS_DIR="windows-build/Example Builds" \
          linux-packaging/scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: DDOBuilder-AppImage
          path: DDOBuilder-*.AppImage

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: DDOBuilder-*.AppImage
